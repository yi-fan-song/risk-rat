services:
  postgres:
    image: postgres:16-alpine
    container_name: risk-rat-postgres
    environment:
      POSTGRES_USER: riskrat
      POSTGRES_PASSWORD: riskrat
      POSTGRES_DB: riskrat
    ports:
      - '54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riskrat -d riskrat']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: risk-rat-redis
    ports:
      - '63790:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
